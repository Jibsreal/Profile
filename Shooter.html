<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Neon Shooter 🔫</title>
<style>
  :root{ --bg:#0a0a0a; --panel:#1a1a2e; --accent:#00eaff; --muted:#ccc; --danger:#ff4757; --power:#ffbe00; }
  html,body{height:100%;margin:0}
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    font-family: 'Segoe UI', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    touch-action:none;
    overflow:hidden;
  }
  #game-container{
    width: min(420px, 94vw);
    padding:18px;
    background:var(--panel);
    border-radius:14px;
    box-shadow:0 10px 36px rgba(0,0,0,0.5);
    position:relative;
  }
  #score{ color:#fff; font-weight:700; text-shadow:0 0 8px #0006; margin-bottom:4px; }
  #combo{ color:var(--power); font-weight:700; text-shadow:0 0 8px #ffbe0066; margin-bottom:8px; font-size:14px; }
  canvas{ width:100%; height:auto; display:block; border-radius:12px; background:linear-gradient(180deg,#2d3546,#1a1e26); box-shadow:0 6px 20px rgba(0,0,0,0.5); touch-action:none; }
  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:rgba(12,14,18,0.95); border-radius:14px; z-index:4; }
  .overlay.hidden{ opacity:0; pointer-events:none; transition:opacity .3s; }
  h1,h2{ color:var(--accent); margin:0; text-shadow:0 0 12px #00eaff66 }
  p{ color:var(--muted); margin:0; text-align:center }
  .menu-buttons{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  button{ cursor:pointer; border:0; padding:10px 18px; border-radius:10px; background:linear-gradient(90deg,var(--accent),#0077ff); color:#fff; font-weight:700; box-shadow:0 6px 18px rgba(0,234,255,0.08); }
  button.secondary{ background:transparent; border:1px solid rgba(255,255,255,0.04); color:var(--muted); font-weight:600; }
  #music-btn{ position:absolute; right:12px; bottom:12px; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; z-index:6; cursor:pointer; background:rgba(0,234,255,0.08); border:1px solid rgba(0,234,255,0.12); color:var(--accent); box-shadow:0 6px 18px rgba(0,234,255,0.06); }
  #music-btn:hover{ transform:scale(1.06); }
  footer{ color:var(--muted); font-size:12px; text-align:center; margin-top:8px; }
</style>
</head>
<body>
  <div id="game-container" role="application" aria-label="Neon Block Shooter">
    <div id="score">Score: 0</div>
    <div id="combo">Combo: 0x</div>
    <canvas id="game-canvas" width="400" height="600" aria-hidden="false"></canvas>

    <div id="menu" class="overlay">
      <h1>Neon Block Shooter</h1>
      <p>Tap center to shoot. Hold left/right of the screen to move.<br>Keyboard: A / D to move, SPACE to shoot.</p>
      <div class="menu-buttons">
        <button id="play-btn">Start Game</button>
        <button id="exit-btn" class="secondary">Return to Profile</button>
      </div>
    </div>

    <div id="game-over" class="overlay hidden" aria-hidden="true">
      <h2>Game Over</h2>
      <p id="final-score">Score: 0</p>
      <div class="menu-buttons">
        <button id="restart-btn">Restart</button>
        <button id="menu-btn" class="secondary">Back to Menu</button>
        <button id="exit-btn-over" class="secondary">Return to Profile</button>
      </div>
    </div>

    <div id="music-btn" title="Toggle music">🔇</div>
    <footer style="text-align:center;font-size:12px;color:var(--muted);margin-top:8px">© 2025</footer>
  </div>

<script>
/* ============================
   FIXED Neon Block Shooter
   - Prevents speed bug
   - Proper rate limiting
   - Frame-rate independent
   ============================ */

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const menu = document.getElementById('menu');
const gameOver = document.getElementById('game-over');
const finalScore = document.getElementById('final-score');
const playBtn = document.getElementById('play-btn');
const restartBtn = document.getElementById('restart-btn');
const menuBtn = document.getElementById('menu-btn');
const exitBtns = [document.getElementById('exit-btn'), document.getElementById('exit-btn-over')];
const musicBtn = document.getElementById('music-btn');

let W = canvas.width = 400;
let H = canvas.height = 600;

/* --- audio --- */
let music = null;
try {
  music = new Audio();
  music.loop = true;
  music.volume = 0.3;
} catch(e) {
  console.log('Audio not supported');
}

let musicMuted = true; // Start muted

musicBtn.addEventListener('click', () => {
  if (!music) return;
  
  musicMuted = !musicMuted;
  if (musicMuted) {
    music.pause();
    musicBtn.textContent = '🔇';
  } else {
    music.play().catch(() => {
      console.log('Music play failed');
      musicMuted = true;
      musicBtn.textContent = '🔇';
    });
    musicBtn.textContent = '🔊';
  }
});

/* --- game state --- */
const player = { 
  x: W/2 - 25, 
  y: H - 60, 
  w: 50, 
  h: 20, 
  color:'#00eaff', 
  speed: 360, // pixels per second
  powerup: null,
  powerupTimer: 0,
  lastShot: 0,
  fireRate: 200 // ms between shots
};

let bullets = [];
let blocks = [];
let particles = [];
let powerups = [];
let score = 0;
let combo = 0;
let comboTimer = 0;
let running = false;
let lastT = 0;
let spawnTimer = 0;
let wave = 1;
let bossActive = false;
let screenShake = 0;

/* --- input state --- */
let leftPress = false;
let rightPress = false;
let shootPressed = false; // NEW: Track if shoot key is held

/* --- touch helpers --- */
let activeTouches = {};

/* utility */
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

/* --- particle system --- */
function createParticle(x, y, color, size = 3, speed = 2) {
  particles.push({
    x, y,
    vx: (Math.random() - 0.5) * speed,
    vy: (Math.random() - 0.5) * speed,
    size: Math.random() * size + 1,
    color,
    life: 30,
    maxLife: 30
  });
}

function updateParticles() {
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    p.size *= 0.95;
    return p.life > 0;
  });
}

function drawParticles() {
  particles.forEach(p => {
    const alpha = p.life / p.maxLife;
    if (alpha <= 0) return;
    
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

/* --- power-up system --- */
const POWERUP_TYPES = {
  RAPID_FIRE: { color: '#ffbe00', duration: 300, name: 'Rapid Fire' },
  MULTI_SHOT: { color: '#ff6b6b', duration: 300, name: 'Multi Shot' },
  SHIELD: { color: '#4ecdc4', duration: 400, name: 'Shield' },
  BOMB: { color: '#ff4757', duration: 0, name: 'Bomb' }
};

function spawnPowerup(x, y) {
  if (Math.random() < 0.12) { // 12% chance
    const types = Object.keys(POWERUP_TYPES);
    const type = types[Math.floor(Math.random() * types.length)];
    powerups.push({ 
      x: x - 10, y, 
      w: 20, h: 20, 
      type, 
      color: POWERUP_TYPES[type].color 
    });
  }
}

function updatePowerups() {
  powerups = powerups.filter(p => {
    p.y += 2;
    return p.y < H + 50;
  });
}

function drawPowerups() {
  powerups.forEach(p => {
    ctx.save();
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 15;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    
    // Draw power-up symbol
    ctx.fillStyle = '#fff';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    const symbol = p.type === 'RAPID_FIRE' ? '⚡' : p.type === 'MULTI_SHOT' ? '◆' : p.type === 'SHIELD' ? '🛡' : '💣';
    ctx.fillText(symbol, p.x + p.w/2, p.y + p.h/2 + 4);
    ctx.restore();
  });
}

function collectPowerup(powerup) {
  const type = powerup.type;
  player.powerup = type;
  player.powerupTimer = POWERUP_TYPES[type].duration;
  
  // Create collection particles
  for (let i = 0; i < 10; i++) {
    createParticle(powerup.x + powerup.w/2, powerup.y + powerup.h/2, powerup.color, 4, 3);
  }
  
  if (type === 'BOMB') {
    // Clear all blocks
    const blocksDestroyed = blocks.length;
    blocks.forEach(block => {
      for (let i = 0; i < 5; i++) {
        createParticle(block.x + block.w/2, block.y + block.h/2, block.color, 5, 4);
      }
    });
    blocks = [];
    score += blocksDestroyed * 2;
    combo += blocksDestroyed;
    comboTimer = 60;
  }
}

/* --- enemy system --- */
function spawnBlock() {
  if (bossActive) return; // Don't spawn regular blocks during boss
  
  const types = [
    { w: 60, h: 30, hp: 1, color: `hsl(${Math.random()*360},80%,60%)`, speed: 60 },
    { w: 40, h: 40, hp: 2, color: `hsl(${Math.random()*360},100%,50%)`, speed: 90 },
    { w: 80, h: 25, hp: 3, color: `hsl(${Math.random()*360},70%,40%)`, speed: 48 }
  ];
  
  const typeIndex = Math.min(Math.floor(wave / 3), types.length - 1);
  const type = types[typeIndex];
  const x = Math.random() * (W - type.w);
  
  blocks.push({
    x, y: -type.h,
    w: type.w, h: type.h,
    color: type.color,
    hp: type.hp,
    maxHp: type.hp,
    speed: type.speed,
    type: type.hp > 1 ? 'strong' : 'normal'
  });
}

function spawnBoss() {
  if (bossActive) return;
  
  bossActive = true;
  const boss = {
    x: W/2 - 60, y: -80,
    w: 120, h: 80,
    color: '#ff4757',
    hp: 15 + wave * 2,
    maxHp: 15 + wave * 2,
    speed: 30,
    type: 'boss',
    shootTimer: 0
  };
  blocks.push(boss);
  screenShake = 10;
}

/* --- shooting mechanics --- */
function shoot() {
  const now = Date.now();
  const currentFireRate = (player.powerup === 'RAPID_FIRE') ? 100 : player.fireRate;
  
  // CRITICAL FIX: Ensure proper rate limiting
  if (now - player.lastShot < currentFireRate) {
    return; // Too soon, don't shoot
  }
  
  if (player.powerup === 'MULTI_SHOT') {
    bullets.push({ x: player.x + player.w/2 - 12, y: player.y - 18, w:8, h:16, speed: 600, color: '#ff6b6b' });
    bullets.push({ x: player.x + player.w/2 - 4, y: player.y - 18, w:8, h:16, speed: 600, color: '#fff' });
    bullets.push({ x: player.x + player.w/2 + 4, y: player.y - 18, w:8, h:16, speed: 600, color: '#ff6b6b' });
  } else {
    bullets.push({ x: player.x + player.w/2 - 4, y: player.y - 18, w:8, h:16, speed: 600, color: '#fff' });
  }
  
  player.lastShot = now;
}

/* --- drawing --- */
function drawPlayer() {
  ctx.save();
  
  // Draw shield if active
  if (player.powerup === 'SHIELD' && player.powerupTimer > 0) {
    const pulse = Math.sin(Date.now() * 0.01) * 5;
    ctx.strokeStyle = '#4ecdc4';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#4ecdc4';
    ctx.shadowBlur = 20 + pulse;
    ctx.beginPath();
    ctx.arc(player.x + player.w/2, player.y + player.h/2, 35, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Draw player
  ctx.fillStyle = player.color;
  ctx.shadowColor = player.color;
  ctx.shadowBlur = 12;
  ctx.fillRect(player.x, player.y, player.w, player.h);
  
  // Draw power-up indicator
  if (player.powerup && player.powerup !== 'SHIELD' && player.powerupTimer > 0) {
    const barWidth = player.w * (player.powerupTimer / POWERUP_TYPES[player.powerup].duration);
    ctx.fillStyle = POWERUP_TYPES[player.powerup].color;
    ctx.fillRect(player.x, player.y - 10, barWidth, 3);
  }
  
  ctx.restore();
}

function drawBullets() { 
  bullets.forEach(b => {
    ctx.save();
    ctx.fillStyle = b.color || '#fff';
    ctx.shadowColor = b.color || '#fff';
    ctx.shadowBlur = 8;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.restore();
  });
}

function drawBlocks() { 
  blocks.forEach(b => {
    ctx.save();
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 15;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    
    // Draw HP bar for strong enemies
    if (b.hp > 1) {
      const hpRatio = b.hp / b.maxHp;
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(b.x, b.y - 12, b.w, 4);
      ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : hpRatio > 0.25 ? '#f39c12' : '#e74c3c';
      ctx.fillRect(b.x, b.y - 12, b.w * hpRatio, 4);
    }
    
    // Draw boss indicator
    if (b.type === 'boss') {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('BOSS', b.x + b.w/2, b.y - 18);
    }
    
    ctx.restore();
  });
}

/* --- screen shake --- */
function applyScreenShake() {
  if (screenShake > 0) {
    const shakeX = (Math.random() - 0.5) * screenShake;
    const shakeY = (Math.random() - 0.5) * screenShake;
    ctx.translate(shakeX, shakeY);
    screenShake *= 0.9;
  }
}

/* --- game logic --- */
function update(dt) {
  // Update timers
  if (player.powerupTimer > 0) {
    player.powerupTimer--;
    if (player.powerupTimer === 0) {
      player.powerup = null;
    }
  }
  
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer === 0) {
      combo = 0;
    }
  }
  
  // Movement (pixels per second * dt)
  if(leftPress) player.x -= player.speed * dt;
  if(rightPress) player.x += player.speed * dt;
  player.x = clamp(player.x, 0, W - player.w);

  // Bullets
  bullets.forEach(b => b.y -= b.speed * dt);
  bullets = bullets.filter(b => b.y > -20);

  // Blocks
  blocks.forEach(b => b.y += (b.speed + score*0.5) * dt); // Slightly increased difficulty
  blocks = blocks.filter(b => b.y < H + 50);

  // Check if boss is dead
  if (bossActive && blocks.length === 0) {
    bossActive = false;
    wave++;
    score += 50; // Boss bonus
    for (let i = 0; i < 20; i++) {
      createParticle(W/2, H/2, '#ff4757', 6, 5);
    }
  }

  // Update power-ups
  updatePowerups();
  
  // Update particles
  updateParticles();

  // Collision detection
  for(let i = bullets.length -1; i >=0; i--) {
    const bullet = bullets[i];
    for(let j = blocks.length -1; j >=0; j--) {
      const block = blocks[j];
      if(bullet.x < block.x + block.w && bullet.x + bullet.w > block.x && 
         bullet.y < block.y + block.h && bullet.y + bullet.h > block.y) {
        
        bullets.splice(i,1);
        block.hp--;
        
        // Create hit particles
        for (let k = 0; k < 3; k++) {
          createParticle(block.x + block.w/2, block.y + block.h/2, block.color, 3, 2);
        }
        
        if (block.hp <= 0) {
          blocks.splice(j,1);
          score++;
          combo++;
          comboTimer = 60; // 1 second at 60fps
          
          // Combo bonus
          if (combo > 5) {
            score += Math.floor(combo / 5);
          }
          
          // Chance to spawn power-up
          spawnPowerup(block.x + block.w/2, block.y + block.h/2);
          
          // Screen shake for strong enemies
          if (block.type === 'strong' || block.type === 'boss') {
            screenShake = 5;
          }
        }
        
        scoreEl.textContent = 'Score: ' + score;
        comboEl.textContent = 'Combo: ' + combo + 'x';
        break;
      }
    }
  }

  // Player hit detection
  for(const block of blocks) {
    if(block.y + block.h >= player.y && block.x < player.x + player.w && block.x + block.w > player.x) {
      if (player.powerup === 'SHIELD' && player.powerupTimer > 0) {
        player.powerupTimer = 0;
        player.powerup = null;
        blocks.splice(blocks.indexOf(block), 1);
        for (let i = 0; i < 8; i++) {
          createParticle(block.x + block.w/2, block.y + block.h/2, '#4ecdc4', 6, 3);
        }
      } else {
        endGame();
        return;
      }
    }
  }

  // Power-up collection
  for(let i = powerups.length -1; i >=0; i--) {
    const powerup = powerups[i];
    if(powerup.y + powerup.h >= player.y && powerup.x < player.x + player.w && powerup.x + powerup.w > player.x) {
      collectPowerup(powerup);
      powerups.splice(i,1);
    }
  }

  // Spawn logic
  spawnTimer += dt;
  const spawnInterval = Math.max(1.5 - wave*0.05, 0.5); // seconds between spawns
  
  if(spawnTimer > spawnInterval && !bossActive) {
    if (wave % 5 === 0 && blocks.length === 0) {
      spawnBoss();
    } else {
      spawnBlock();
    }
    spawnTimer = 0;
  }
}

function render() {
  ctx.clearRect(0,0,W,H);
  
  // Apply screen shake
  ctx.save();
  applyScreenShake();
  
  // Draw game elements
  drawParticles();
  drawPowerups();
  drawBlocks();
  drawBullets();
  drawPlayer();
  
  ctx.restore();
}

function loop(ts) {
  if(!running) return;
  const dt = Math.min((ts - lastT)/1000, 0.05) || 0.016;
  lastT = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* --- game control --- */
function startGame() {
  // Reset ALL state completely
  score = 0;
  bullets = [];
  blocks = [];
  particles = [];
  powerups = [];
  spawnTimer = 0;
  wave = 1;
  bossActive = false;
  combo = 0;
  comboTimer = 0;
  screenShake = 0;
  
  // Reset player
  player.x = W/2 - player.w/2;
  player.powerup = null;
  player.powerupTimer = 0;
  player.lastShot = 0;
  
  // Reset input
  leftPress = false;
  rightPress = false;
  shootPressed = false;
  
  // Update UI
  scoreEl.textContent = 'Score: 0';
  comboEl.textContent = 'Combo: 0x';
  
  // Hide menus
  menu.classList.add('hidden');
  gameOver.classList.add('hidden');
  
  // Start game loop
  running = true;
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  finalScore.textContent = `Score: ${score} | Wave: ${wave} | Best Combo: ${combo}x`;
  gameOver.classList.remove('hidden');
}

function backToMenu() {
  running = false;
  menu.classList.remove('hidden');
  gameOver.classList.add('hidden');
}

/* --- keyboard controls --- */
document.addEventListener('keydown', e => {
  // CRITICAL FIX: Prevent default browser behavior for game keys
  const gameKeys = ['KeyA', 'KeyD', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter', 'KeyF'];
  if (gameKeys.includes(e.code)) {
    e.preventDefault();
  }
  
  if(e.code === 'KeyA' || e.code === 'ArrowLeft') leftPress = true;
  if(e.code === 'KeyD' || e.code === 'ArrowRight') rightPress = true;
  if((e.code === 'KeyF' || e.code === 'Space') && running) {
    shootPressed = true; // NEW: Track key press
    shoot(); // Shoot immediately on press
  }
});

document.addEventListener('keyup', e => {
  if(e.code === 'KeyA' || e.code === 'ArrowLeft') leftPress = false;
  if(e.code === 'KeyD' || e.code === 'ArrowRight') rightPress = false;
  if(e.code === 'KeyF' || e.code === 'Space' || e.code === 'Enter') {
    shootPressed = false; // NEW: Track key release
  }
});

/* --- CRITICAL FIX: Manual shooting loop to prevent key repeat spam --- */
function handleShooting() {
  if (shootPressed && running) {
    shoot();
  }
  requestAnimationFrame(handleShooting);
}
handleShooting(); // Start the shooting loop

/* --- touch controls --- */
const TAP_MAX = 300;
const MOVE_TOL = 20;

function getCanvasRect(){ return canvas.getBoundingClientRect(); }

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  const rect = getCanvasRect();
  const leftBound = rect.width * 0.30;
  const rightBound = rect.width * 0.70;
  
  for(const t of e.changedTouches){
    const id = t.identifier;
    const x = t.clientX - rect.left;
    let mode = 'tap';
    
    if(x < leftBound) mode = 'hold-left';
    else if(x > rightBound) mode = 'hold-right';
    
    activeTouches[id] = { startX: x, startY: t.clientY - rect.top, startT: Date.now(), mode, moved:false };
    
    if(mode === 'hold-left') leftPress = true;
    if(mode === 'hold-right') rightPress = true;
  }
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  const rect = getCanvasRect();
  const leftBound = rect.width * 0.30;
  const rightBound = rect.width * 0.70;
  
  for(const t of e.changedTouches){
    const id = t.identifier;
    const info = activeTouches[id];
    if(!info) continue;
    
    const x = t.clientX - rect.left;
    const dx = Math.abs(x - info.startX);
    const dy = Math.abs((t.clientY - rect.top) - info.startY);
    
    if(dx > MOVE_TOL || dy > MOVE_TOL) {
      info.moved = true;
      
      if(x < leftBound){
        info.mode = 'hold-left';
        leftPress = true;
        rightPress = false;
      } else if(x > rightBound){
        info.mode = 'hold-right';
        rightPress = true;
        leftPress = false;
      } else {
        leftPress = false;
        rightPress = false;
      }
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  const rect = getCanvasRect();
  
  for(const t of e.changedTouches){
    const id = t.identifier;
    const info = activeTouches[id];
    if(!info) continue;
    
    const dt = Date.now() - info.startT;
    
    if(info.mode === 'tap' && dt <= TAP_MAX && !info.moved && running){
      shoot(); // Tap to shoot
    }
    
    if(info.mode === 'hold-left') leftPress = false;
    if(info.mode === 'hold-right') rightPress = false;
    
    delete activeTouches[id];
  }
}, { passive: false });

canvas.addEventListener('touchcancel', function(e) {
  e.preventDefault();
  for(const t of e.changedTouches){
    const id = t.identifier;
    const info = activeTouches[id];
    if(info){
      if(info.mode === 'hold-left') leftPress = false;
      if(info.mode === 'hold-right') rightPress = false;
      delete activeTouches[id];
    }
  }
}, { passive: false });

/* --- buttons --- */
playBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
menuBtn.addEventListener('click', backToMenu);
exitBtns.forEach(b => b.addEventListener('click', () => location.href = 'index.html'));

/* --- resize handling --- */
function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* initial state */
scoreEl.textContent = 'Score: 0';
comboEl.textContent = 'Combo: 0x';
</script>
</body>
