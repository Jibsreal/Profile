<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Block Shooter</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #181c24;
        font-family: 'Segoe UI', Arial, sans-serif;
        overflow: hidden;
        touch-action: none;
    }

    #game-container {
        position: relative;
        background: #232a34;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        overflow: hidden;
    }

    #score {
        color: white;
        font-size: 1.3rem;
        font-weight: bold;
        margin-bottom: 10px;
        text-shadow: 0 0 8px #00eaff88;
    }

    #game-canvas {
        border-radius: 12px;
        background: linear-gradient(180deg, #2d3546 0%, #1a1e26 100%);
        box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        touch-action: none;
    }

    button {
        background: linear-gradient(90deg, #00eaff 0%, #0077ff 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 32px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 2px 8px #00eaff44;
        transition: all 0.2s ease;
    }

    button:hover {
        transform: scale(1.05);
        background: linear-gradient(90deg, #0077ff 0%, #00eaff 100%);
    }

    .overlay {
        position: absolute;
        inset: 0;
        background: rgba(24, 28, 36, 0.97);
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: center;
        transition: opacity 0.4s ease;
    }

    .overlay.hidden {
        opacity: 0;
        pointer-events: none;
    }

    h1, h2 {
        color: #00eaff;
        text-shadow: 0 0 12px #00eaff99;
        margin: 0;
    }

    p {
        color: #ccc;
        font-size: 1rem;
        max-width: 280px;
        line-height: 1.4;
    }

    .menu-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* Touch zones */
    .touch-zone {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        opacity: 0;
        z-index: 2;
    }
    #left-zone { left: 0; }
    #right-zone { right: 0; }
</style>
</head>
<body>
<div id="game-container">
    <div id="score">Score: 0</div>
    <canvas id="game-canvas" width="400" height="600"></canvas>

    <!-- Main Menu -->
    <div id="menu" class="overlay">
        <h1>Neon Block Shooter</h1>
        <p>Use <b>A</b>/<b>D</b> or tap sides to move.<br>Tap or press <b>F</b> to shoot.</p>
        <div class="menu-buttons">
            <button id="play-btn">Start Game</button>
            <button id="exit-btn">Return to Index</button>
        </div>
    </div>

    <!-- Game Over -->
    <div id="game-over" class="overlay hidden">
        <h2>Game Over</h2>
        <p id="final-score">Score: 0</p>
        <div class="menu-buttons">
            <button id="restart-btn">Restart</button>
            <button id="menu-btn">Back to Menu</button>
            <button id="exit-btn-over">Return to Index</button>
        </div>
    </div>

    <!-- Touch controls -->
    <div id="left-zone" class="touch-zone"></div>
    <div id="right-zone" class="touch-zone"></div>
</div>

<script>
const canvas = document.getElementById("game-canvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const menu = document.getElementById("menu");
const gameOverScreen = document.getElementById("game-over");
const playBtn = document.getElementById("play-btn");
const restartBtn = document.getElementById("restart-btn");
const menuBtn = document.getElementById("menu-btn");
const finalScoreEl = document.getElementById("final-score");
const exitBtns = [document.getElementById("exit-btn"), document.getElementById("exit-btn-over")];
const leftZone = document.getElementById("left-zone");
const rightZone = document.getElementById("right-zone");

const music = new Audio("https://cdn.pixabay.com/download/audio/2022/10/03/audio_68a18c9e65.mp3?filename=arcade-game-music-loop-112191.mp3");
music.loop = true;
music.volume = 0;

function playMusic() {
    music.play().then(() => {
        let volume = 0;
        const fade = setInterval(() => {
            volume += 0.05;
            music.volume = Math.min(volume, 0.4);
            if (volume >= 0.4) clearInterval(fade);
        }, 100);
    }).catch(() => {});
}

// Game objects
const player = {
    x: 175,
    y: 540,
    width: 50,
    height: 20,
    color: "#00eaff",
    speed: 6
};

let bullets = [];
let blocks = [];
let score = 0;
let gameActive = false;
let leftPressed = false, rightPressed = false;
let spawnTimer = 0;

// Core functions
function drawPlayer() {
    ctx.fillStyle = player.color;
    ctx.shadowColor = "#00eaff";
    ctx.shadowBlur = 12;
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.shadowBlur = 0;
}

function drawBullets() {
    ctx.fillStyle = "#fff";
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
}

function drawBlocks() {
    blocks.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.width, b.height);
    });
}

function movePlayer() {
    if (leftPressed) player.x -= player.speed;
    if (rightPressed) player.x += player.speed;
    player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
}

function spawnBlock() {
    const width = 60, height = 30;
    const x = Math.random() * (canvas.width - width);
    const color = `hsl(${Math.random()*360}, 80%, 60%)`;
    blocks.push({ x, y: -height, width, height, color });
}

function shoot() {
    bullets.push({ x: player.x + player.width/2 - 4, y: player.y - 16, width: 8, height: 16, speed: 10 });
}

function update() {
    movePlayer();

    bullets.forEach(b => b.y -= b.speed);
    bullets = bullets.filter(b => b.y > -20);

    blocks.forEach(b => b.y += 2 + score * 0.02);
    blocks = blocks.filter(b => b.y < canvas.height + 50);

    bullets.forEach((b, bi) => {
        blocks.forEach((bl, blki) => {
            if (b.x < bl.x + bl.width && b.x + b.width > bl.x && b.y < bl.y + bl.height && b.y + b.height > bl.y) {
                bullets.splice(bi, 1);
                blocks.splice(blki, 1);
                score++;
                scoreEl.textContent = "Score: " + score;
            }
        });
    });

    if (blocks.some(b => b.y + b.height >= player.y && b.x < player.x + player.width && b.x + b.width > player.x)) {
        endGame();
    }

    spawnTimer++;
    if (spawnTimer > Math.max(60 - score, 20)) {
        spawnBlock();
        spawnTimer = 0;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawPlayer();
    drawBullets();
    drawBlocks();
}

function gameLoop() {
    if (!gameActive) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function startGame() {
    score = 0;
    bullets = [];
    blocks = [];
    player.x = 175;
    scoreEl.textContent = "Score: 0";
    menu.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    gameActive = true;
    playMusic();
    gameLoop();
}

function endGame() {
    gameActive = false;
    finalScoreEl.textContent = "Score: " + score;
    gameOverScreen.classList.remove("hidden");
}

function backToMenu() {
    gameActive = false;
    menu.classList.remove("hidden");
    gameOverScreen.classList.add("hidden");
}

// Controls
document.addEventListener("keydown", e => {
    if (e.code === "KeyA") leftPressed = true;
    if (e.code === "KeyD") rightPressed = true;
    if ((e.code === "KeyF" || e.code === "Space") && gameActive) shoot();
});
document.addEventListener("keyup", e => {
    if (e.code === "KeyA") leftPressed = false;
    if (e.code === "KeyD") rightPressed = false;
});

// Touch controls
leftZone.addEventListener("touchstart", () => leftPressed = true);
leftZone.addEventListener("touchend", () => leftPressed = false);
rightZone.addEventListener("touchstart", () => rightPressed = true);
rightZone.addEventListener("touchend", () => rightPressed = false);
canvas.addEventListener("touchstart", () => { if (gameActive) shoot(); });

// Buttons
playBtn.onclick = startGame;
restartBtn.onclick = startGame;
menuBtn.onclick = backToMenu;
exitBtns.forEach(btn => btn.onclick = () => window.location.href = "index.html");
</script>
</body>
</html>
