<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Neon Shooter 🔫</title>
<style>
  :root{ --bg:#0a0a0a; --panel:#1a1a2e; --accent:#00eaff; --muted:#ccc; --danger:#ff4757; --power:#ffbe00; }
  html,body{height:100%;margin:0}
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    font-family: 'Segoe UI', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    touch-action:none;
    overflow:hidden;
  }
  #game-container{
    width: min(420px, 94vw);
    padding:18px;
    background:var(--panel);
    border-radius:14px;
    box-shadow:0 10px 36px rgba(0,0,0,0.5);
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  #score{ color:#fff; font-weight:700; text-shadow:0 0 8px #0006; margin-bottom:4px; }
  #combo{ color:var(--power); font-weight:700; text-shadow:0 0 8px #ffbe0066; margin-bottom:8px; font-size:14px; }
  #ammo-display{ color:var(--accent); font-weight:700; text-shadow:0 0 8px #00eaff66; margin-bottom:8px; font-size:14px; }
  #wave-display{ color:var(--muted); font-weight:600; text-shadow:0 0 8px #0006; margin-bottom:8px; font-size:14px; }
  canvas{
    width:100%;
    height:auto;
    max-width:400px;
    aspect-ratio:2/3;
    display:block;
    border-radius:12px;
    background:linear-gradient(180deg,#2d3546,#1a1e26);
    box-shadow:0 6px 20px rgba(0,0,0,0.5);
    touch-action:none;
  }
  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:rgba(12,14,18,0.95); border-radius:14px; z-index:4; }
  .overlay.hidden{ opacity:0; pointer-events:none; transition:opacity .3s; }
  h1,h2{ color:var(--accent); margin:0; text-shadow:0 0 12px #00eaff66 }
  p{ color:var(--muted); margin:0; text-align:center }
  .menu-buttons{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  button{ cursor:pointer; border:0; padding:10px 18px; border-radius:10px; background:linear-gradient(90deg,var(--accent),#0077ff); color:#fff; font-weight:700; box-shadow:0 6px 18px rgba(0,234,255,0.08); }
  button.secondary{ background:transparent; border:1px solid rgba(255,255,255,0.04); color:var(--muted); font-weight:600; }
  #music-btn{ position:absolute; right:12px; bottom:12px; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; z-index:6; cursor:pointer; background:rgba(0,234,255,0.08); border:1px solid rgba(0,234,255,0.12); color:var(--accent); box-shadow:0 6px 18px rgba(0,234,255,0.06); }
  #music-btn:hover{ transform:scale(1.06); }
  footer{ color:var(--muted); font-size:12px; text-align:center; margin-top:8px; }
  .difficulty-selector{ display:flex; gap:8px; margin:8px 0; }
  .difficulty-selector button{ padding:8px 12px; font-size:12px; }
  .difficulty-selector button.active{ background:linear-gradient(90deg,var(--power),#ff6b6b); }
  .wave-bar-container{ width:100%; height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; margin-top:4px; }
  .wave-bar{ height:100%; background:linear-gradient(90deg,var(--accent),var(--power)); width:0%; transition:width 0.2s; }
  .reload-warning{ animation:blink 0.5s infinite; }
  @keyframes blink{ 50%{ opacity:0.3; } }
</style>
</head>
<body>
  <div id="game-container" role="application" aria-label="Neon Block Shooter">
    <div id="score">Score: 0</div>
    <div id="combo">Combo: 0x</div>
    <div id="ammo-display">AMMO: 30 / 30</div>
    <div id="wave-display">WAVE 1 - Normal Enemies</div>
    <div class="wave-bar-container">
      <div class="wave-bar" id="wave-bar"></div>
    </div>
    <canvas id="game-canvas" width="400" height="600" aria-hidden="false"></canvas>

    <div id="menu" class="overlay">
      <h1>Neon Block Shooter</h1>
      <p>Select Difficulty:</p>
      <div class="difficulty-selector">
        <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
        <button class="difficulty-btn" data-difficulty="normal">Normal</button>
        <button class="difficulty-btn" data-difficulty="hard">Hard</button>
      </div>
      <p>Tap center to shoot. Hold left/right to move.<br>Keyboard: A/D to move, SPACE to shoot, R to reload.</p>
      <div class="menu-buttons">
        <button id="play-btn">Start Game</button>
        <button id="exit-btn" class="secondary">Return to Profile</button>
      </div>
    </div>

    <div id="game-over" class="overlay hidden" aria-hidden="true">
      <h2>Game Over</h2>
      <p id="final-score">Score: 0</p>
      <div class="menu-buttons">
        <button id="restart-btn">Restart</button>
        <button id="menu-btn" class="secondary">Back to Menu</button>
        <button id="exit-btn-over" class="secondary">Return to Profile</button>
      </div>
    </div>

    <div id="music-btn" title="Toggle music">🔇</div>
    <footer style="text-align:center;font-size:12px;color:var(--muted);margin-top:8px">© 2025</footer>
  </div>

<script>
/* ============================
   FIXED UI SCALING VERSION
   - Proper coordinate mapping
   - High-DPI support
   - Responsive canvas
   ============================ */

const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const comboEl = document.getElementById('combo');
const ammoEl = document.getElementById('ammo-display');
const waveEl = document.getElementById('wave-display');
const waveBar = document.getElementById('wave-bar');
const menu = document.getElementById('menu');
const gameOver = document.getElementById('game-over');
const finalScore = document.getElementById('final-score');
const playBtn = document.getElementById('play-btn');
const restartBtn = document.getElementById('restart-btn');
const menuBtn = document.getElementById('menu-btn');
const exitBtns = [document.getElementById('exit-btn'), document.getElementById('exit-btn-over')];
const musicBtn = document.getElementById('music-btn');
const difficultyBtns = document.querySelectorAll('.difficulty-btn');

let W = 400; // Internal game width
let H = 600; // Internal game height
let dpr = window.devicePixelRatio || 1;

/* --- audio --- */
let music = null;
try {
  music = new Audio();
  music.loop = true;
  music.volume = 0.3;
} catch(e) {
  console.log('Audio not supported');
}

let musicMuted = true;

musicBtn.addEventListener('click', () => {
  if (!music) return;
  musicMuted = !musicMuted;
  if (musicMuted) {
    music.pause();
    musicBtn.textContent = '🔇';
  } else {
    music.play().catch(() => {
      musicMuted = true;
      musicBtn.textContent = '🔇';
    });
    musicBtn.textContent = '🔊';
  }
});

/* --- game state --- */
const DIFFICULTY = {
  easy: { enemySpeed: 0.7, spawnRate: 2.0, ammo: 1500, playerFireRate: 100, playerSpeed: 300 },
  normal: { enemySpeed: 1.0, spawnRate: 1.5, ammo: 1000, playerFireRate: 150, playerSpeed: 360 },
  hard: { enemySpeed: 1.5, spawnRate: 1.0, ammo: 500, playerFireRate: 250, playerSpeed: 420 }
};

let currentDifficulty = 'normal';
let enemiesInWave = 0;
let enemiesKilledInWave = 0;
let waveTarget = 10;

const player = { 
  x: W/2 - 25, 
  y: H - 60, 
  w: 50, 
  h: 20, 
  color:'#00eaff', 
  powerup: null,
  powerupTimer: 0,
  lastShot: 0
};

let bullets = [];
let blocks = [];
let particles = [];
let powerups = [];
let score = 0;
let combo = 0;
let comboTimer = 0;
let running = false;
let lastT = 0;
let spawnTimer = 0;
let wave = 1;
let bossActive = false;
let screenShake = 0;

/* --- ammo system --- */
let maxAmmo = DIFFICULTY[currentDifficulty].ammo;
let currentAmmo = maxAmmo;
let isReloading = false;
let reloadTimer = 0;
const RELOAD_TIME = 2000;

/* --- input state --- */
let leftPress = false;
let rightPress = false;
let shootPressed = false;

/* --- touch helpers --- */
let activeTouches = {};

/* --- SCALING HELPERS --- */
let canvasScale = { x: 1, y: 1 };
let displayWidth = 400;
let displayHeight = 600;

function updateCanvasScale() {
  const rect = canvas.getBoundingClientRect();
  displayWidth = rect.width;
  displayHeight = rect.height;
  canvasScale.x = W / displayWidth;
  canvasScale.y = H / displayHeight;
}

function getCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) * canvasScale.x,
    y: (clientY - rect.top) * canvasScale.y
  };
}

/* utility */
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

/* --- particle system --- */
function createParticle(x, y, color, size = 3, speed = 2) {
  particles.push({
    x, y,
    vx: (Math.random() - 0.5) * speed,
    vy: (Math.random() - 0.5) * speed,
    size: Math.random() * size + 1,
    color,
    life: 30,
    maxLife: 30
  });
}

function updateParticles() {
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    p.size *= 0.95;
    return p.life > 0;
  });
}

function drawParticles() {
  particles.forEach(p => {
    const alpha = p.life / p.maxLife;
    if (alpha <= 0) return;
    
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

/* --- floating text system --- */
function createFloatingText(x, y, text, color = '#fff') {
  floatingTexts.push({
    x, y,
    text,
    color,
    life: 30,
    maxLife: 30,
    vy: -1
  });
}

function updateFloatingTexts() {
  floatingTexts = floatingTexts.filter(t => {
    t.y += t.vy;
    t.life--;
    return t.life > 0;
  });
}

function drawFloatingTexts() {
  floatingTexts.forEach(t => {
    const alpha = t.life / t.maxLife;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = t.color;
    ctx.font = 'bold 14px Arial';
    ctx.textAlign = 'center';
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 10;
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  });
}

/* --- power-up system --- */
const POWERUP_TYPES = {
  RAPID_FIRE: { color: '#ffbe00', duration: 300, name: 'Rapid Fire' },
  MULTI_SHOT: { color: '#ff6b6b', duration: 300, name: 'Multi Shot' },
  SHIELD: { color: '#4ecdc4', duration: 400, name: 'Shield' },
  BOMB: { color: '#ff4757', duration: 0, name: 'Bomb' },
  AMMO: { color: '#a8e6cf', duration: 0, name: 'Ammo' }
};

function spawnPowerup(x, y) {
  if (Math.random() < 0.9) {
    const types = Object.keys(POWERUP_TYPES);
    const type = types[Math.floor(Math.random() * types.length)];
    powerups.push({ 
      x: x - 10, y, 
      w: 20, h: 20, 
      type, 
      color: POWERUP_TYPES[type].color 
    });
  }
}

function updatePowerups() {
  powerups = powerups.filter(p => {
    p.y += 2;
    return p.y < H + 50;
  });
}

function drawPowerups() {
  powerups.forEach(p => {
    ctx.save();
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 15;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    
    // Draw power-up symbol
    ctx.fillStyle = '#fff';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    const symbol = p.type === 'RAPID_FIRE' ? '⚡' : p.type === 'MULTI_SHOT' ? '◆' : 
                   p.type === 'SHIELD' ? '🛡' : p.type === 'BOMB' ? '💣' : '📦';
    ctx.fillText(symbol, p.x + p.w/2, p.y + p.h/2 + 4);
    ctx.restore();
  });
}

function collectPowerup(powerup) {
  const type = powerup.type;
  
  // Create collection particles
  for (let i = 0; i < 10; i++) {
    createParticle(powerup.x + powerup.w/2, powerup.y + powerup.h/2, powerup.color, 4, 3);
  }

  if (type === 'AMMO') {
    currentAmmo = Math.min(currentAmmo + 10, maxAmmo);
  } else {
    player.powerup = type;
    player.powerupTimer = POWERUP_TYPES[type].duration;
  }
  
  if (type === 'BOMB') {
    const blocksDestroyed = blocks.length;
    blocks.forEach(block => {
      for (let i = 0; i < 5; i++) {
        createParticle(block.x + block.w/2, block.y + block.h/2, block.color, 5, 4);
      }
    });
    blocks = [];
    score += blocksDestroyed * 2;
    combo += blocksDestroyed;
    comboTimer = 60;
    createFloatingText(W/2, H/2, `+${blocksDestroyed * 2}`, '#ff4757');
  }
}

/* --- enemy system --- */
function spawnBlock() {
  if (bossActive) return;
  
  const diff = DIFFICULTY[currentDifficulty];
  const types = [
    { w: 60, h: 30, hp: 1, color: `hsl(${Math.random()*360},80%,60%)`, speed: 60 * diff.enemySpeed },
    { w: 40, h: 40, hp: 2, color: `hsl(${Math.random()*360},100%,50%)`, speed: 90 * diff.enemySpeed },
    { w: 80, h: 25, hp: 3, color: `hsl(${Math.random()*360},70%,40%)`, speed: 48 * diff.enemySpeed }
  ];
  
  const typeIndex = Math.min(Math.floor(wave / 3), types.length - 1);
  const type = types[typeIndex];
  const x = Math.random() * (W - type.w);
  
  blocks.push({
    x, y: -type.h,
    w: type.w, h: type.h,
    color: type.color,
    hp: type.hp,
    maxHp: type.hp,
    speed: type.speed,
    type: type.hp > 1 ? 'strong' : 'normal'
  });
  
  enemiesInWave++;
}

function spawnBoss() {
  if (bossActive) return;
  
  bossActive = true;
  const diff = DIFFICULTY[currentDifficulty];
  const boss = {
    x: W/2 - 60, y: -80,
    w: 120, h: 80,
    color: '#ff4757',
    hp: 15 + wave * 3,
    maxHp: 15 + wave * 3,
    speed: 30 * diff.enemySpeed,
    type: 'boss',
    shootTimer: 0
  };
  blocks.push(boss);
  screenShake = 10;
  createFloatingText(W/2, 100, `BOSS WAVE ${wave}!`, '#ff4757');
}

/* --- shooting & reload --- */
function shoot() {
  if (isReloading || currentAmmo <= 0) {
    if (!isReloading) {
      startReload();
    }
    return;
  }

  const now = Date.now();
  const currentFireRate = (player.powerup === 'RAPID_FIRE') ? 100 : DIFFICULTY[currentDifficulty].playerFireRate;
  
  if (now - player.lastShot < currentFireRate) {
    return;
  }
  
  if (player.powerup === 'MULTI_SHOT') {
    bullets.push({ x: player.x + player.w/2 - 12, y: player.y - 18, w:8, h:16, speed: 600, color: '#ff6b6b' });
    bullets.push({ x: player.x + player.w/2 - 4, y: player.y - 18, w:8, h:16, speed: 600, color: '#fff' });
    bullets.push({ x: player.x + player.w/2 + 4, y: player.y - 18, w:8, h:16, speed: 600, color: '#ff6b6b' });
    currentAmmo -= 3;
  } else {
    bullets.push({ x: player.x + player.w/2 - 4, y: player.y - 18, w:8, h:16, speed: 600, color: '#fff' });
    currentAmmo--;
  }
  
  player.lastShot = now;
  updateAmmoDisplay();
}

function startReload() {
  if (isReloading || currentAmmo === maxAmmo) return;
  isReloading = true;
  reloadTimer = RELOAD_TIME;
  ammoEl.classList.add('reload-warning');
  ammoEl.textContent = 'RELOADING...';
}

function updateReload(dt) {
  if (!isReloading) return;
  
  reloadTimer -= dt * 1000;
  
  if (reloadTimer <= 0) {
    currentAmmo = maxAmmo;
    isReloading = false;
    reloadTimer = 0;
    ammoEl.classList.remove('reload-warning');
    updateAmmoDisplay();
  } else {
    const progress = Math.ceil(reloadTimer / 1000);
    ammoEl.textContent = `RELOADING... ${progress}s`;
  }
}

function updateAmmoDisplay() {
  if (!isReloading) {
    ammoEl.textContent = `AMMO: ${currentAmmo} / ${maxAmmo}`;
  }
}

/* --- drawing --- */
function drawPlayer() {
  ctx.save();
  
  // Draw shield if active
  if (player.powerup === 'SHIELD' && player.powerupTimer > 0) {
    const pulse = Math.sin(Date.now() * 0.01) * 5;
    ctx.strokeStyle = '#4ecdc4';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#4ecdc4';
    ctx.shadowBlur = 20 + pulse;
    ctx.beginPath();
    ctx.arc(player.x + player.w/2, player.y + player.h/2, 35, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Draw player
  ctx.fillStyle = player.color;
  ctx.shadowColor = player.color;
  ctx.shadowBlur = 12;
  ctx.fillRect(player.x, player.y, player.w, player.h);
  
  // Draw power-up indicator
  if (player.powerup && player.powerup !== 'SHIELD' && player.powerupTimer > 0) {
    const barWidth = player.w * (player.powerupTimer / POWERUP_TYPES[player.powerup].duration);
    ctx.fillStyle = POWERUP_TYPES[player.powerup].color;
    ctx.fillRect(player.x, player.y - 10, barWidth, 3);
  }
  
  ctx.restore();
}

function drawBullets() { 
  bullets.forEach(b => {
    ctx.save();
    ctx.fillStyle = b.color || '#fff';
    ctx.shadowColor = b.color || '#fff';
    ctx.shadowBlur = 8;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.restore();
  });
}

function drawBlocks() { 
  blocks.forEach(b => {
    ctx.save();
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color;
    ctx.shadowBlur = 15;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    
    // Draw HP bar for strong enemies
    if (b.hp > 1) {
      const hpRatio = b.hp / b.maxHp;
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(b.x, b.y - 12, b.w, 4);
      ctx.fillStyle = hpRatio > 0.5 ? '#2ecc71' : hpRatio > 0.25 ? '#f39c12' : '#e74c3c';
      ctx.fillRect(b.x, b.y - 12, b.w * hpRatio, 4);
    }
    
    // Draw boss indicator
    if (b.type === 'boss') {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('BOSS', b.x + b.w/2, b.y - 18);
    }
    
    ctx.restore();
  });
}

function applyScreenShake() {
  if (screenShake > 0) {
    const shakeX = (Math.random() - 0.5) * screenShake;
    const shakeY = (Math.random() - 0.5) * screenShake;
    ctx.translate(shakeX, shakeY);
    screenShake *= 0.9;
  }
}

function updateWaveDisplay() {
  waveEl.textContent = `WAVE ${wave} - ${bossActive ? 'BOSS BATTLE' : `${enemiesKilledInWave}/${waveTarget} Enemies`}`;
  
  if (!bossActive) {
    const progress = Math.min(enemiesKilledInWave / waveTarget, 1) * 100;
    waveBar.style.width = progress + '%';
  } else {
    waveBar.style.width = '100%';
    waveBar.style.background = 'linear-gradient(90deg, #ff4757, #ff6b6b)';
  }
}

function update(dt) {
  // Update timers
  if (player.powerupTimer > 0) {
    player.powerupTimer--;
    if (player.powerupTimer === 0) {
      player.powerup = null;
    }
  }
  
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer === 0) {
      combo = 0;
    }
  }
  
  // Movement
  const playerSpeed = player.powerup === 'RAPID_FIRE' ? DIFFICULTY[currentDifficulty].playerSpeed * 1.2 : DIFFICULTY[currentDifficulty].playerSpeed;
  if(leftPress) player.x -= playerSpeed * dt;
  if(rightPress) player.x += playerSpeed * dt;
  player.x = clamp(player.x, 0, W - player.w);

  // Bullets
  bullets.forEach(b => b.y -= b.speed * dt);
  bullets = bullets.filter(b => b.y > -20);

  // Blocks
  const enemySpeedMultiplier = DIFFICULTY[currentDifficulty].enemySpeed;
  blocks.forEach(b => b.y += (b.speed + score*0.3) * enemySpeedMultiplier * dt);
  blocks = blocks.filter(b => b.y < H + 50);

  // Check if boss is dead
  if (bossActive && !blocks.some(b => b.type === 'boss')) {
    bossActive = false;
    wave++;
    enemiesKilledInWave = 0;
    waveTarget = 10 + wave * 2;
    score += 50 + wave * 10;
    screenShake = 15;
    createFloatingText(W/2, H/2, `WAVE ${wave} CLEARED! +${50 + wave * 10}`, '#ffd700');
  }

  // Update power-ups
  updatePowerups();
  
  // Update particles
  updateParticles();

  // Update floating texts
  updateFloatingTexts();

  // Collision detection
  for(let i = bullets.length -1; i >=0; i--) {
    const bullet = bullets[i];
    for(let j = blocks.length -1; j >=0; j--) {
      const block = blocks[j];
      if(bullet.x < block.x + block.w && bullet.x + bullet.w > block.x && 
         bullet.y < block.y + block.h && bullet.y + bullet.h > block.y) {
        
        bullets.splice(i,1);
        block.hp--;
        
        // Create hit particles
        for (let k = 0; k < 3; k++) {
          createParticle(block.x + block.w/2, block.y + block.h/2, block.color, 3, 2);
        }
        
        if (block.hp <= 0) {
          blocks.splice(j,1);
          enemiesKilledInWave++;
          
          let points = 1;
          let popupColor = '#fff';
          
          if (block.type === 'strong') {
            points = 2;
            popupColor = '#ffbe00';
          } else if (block.type === 'boss') {
            points = 10 + wave * 2;
            popupColor = '#ff4757';
          }
          
          const comboBonus = Math.floor(combo / 5);
          points += comboBonus;
          
          score += points;
          combo++;
          comboTimer = 60;
          
          createFloatingText(block.x + block.w/2, block.y, `+${points}`, popupColor);
          spawnPowerup(block.x + block.w/2, block.y + block.h/2);
          
          if (block.type === 'strong' || block.type === 'boss') {
            screenShake = 5;
          }
        }
        
        break;
      }
    }
  }

  // Player hit detection
  for(const block of blocks) {
    if(block.y + block.h >= player.y && block.x < player.x + player.w && block.x + block.w > player.x) {
      if (player.powerup === 'SHIELD' && player.powerupTimer > 0) {
        player.powerupTimer = 0;
        player.powerup = null;
        blocks.splice(blocks.indexOf(block), 1);
        for (let i = 0; i < 8; i++) {
          createParticle(block.x + block.w/2, block.y + block.h/2, '#4ecdc4', 6, 3);
        }
      } else {
        endGame();
        return;
      }
    }
  }

  // Power-up collection
  for(let i = powerups.length -1; i >=0; i--) {
    const powerup = powerups[i];
    if(powerup.y + powerup.h >= player.y && powerup.x < player.x + player.w && powerup.x + powerup.w > player.x) {
      collectPowerup(powerup);
      powerups.splice(i,1);
    }
  }

  // Update reload
  updateReload(dt);

  // Spawn logic
  const spawnInterval = DIFFICULTY[currentDifficulty].spawnRate;
  spawnTimer += dt;
  
  if(spawnTimer > spawnInterval && !bossActive) {
    if (enemiesKilledInWave >= waveTarget) {
      if (!bossActive) {
        spawnBoss();
      }
    } else {
      spawnBlock();
    }
    spawnTimer = 0;
  }
  
  // Update displays
  updateWaveDisplay();
  scoreEl.textContent = 'Score: ' + score;
  comboEl.textContent = 'Combo: ' + combo + 'x';
}

function render() {
  ctx.clearRect(0,0,W,H);
  
  ctx.save();
  applyScreenShake();
  
  drawParticles();
  drawPowerups();
  drawBlocks();
  drawBullets();
  drawPlayer();
  drawFloatingTexts();
  
  ctx.restore();
}

function loop(ts) {
  if(!running) return;
  const dt = Math.min((ts - lastT)/1000, 0.05) || 0.016;
  lastT = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function startGame() {
  // Reset state
  score = 0; bullets = []; blocks = []; particles = []; floatingTexts = []; powerups = [];
  spawnTimer = 0; wave = 1; bossActive = false; combo = 0; comboTimer = 0; screenShake = 0;
  enemiesInWave = 0; enemiesKilledInWave = 0; waveTarget = 10;
  
  // Reset player
  player.x = W/2 - player.w/2; player.powerup = null; player.powerupTimer = 0; player.lastShot = 0;
  
  // Reset ammo
  maxAmmo = DIFFICULTY[currentDifficulty].ammo; currentAmmo = maxAmmo; isReloading = false; reloadTimer = 0;
  
  // Reset input
  leftPress = false; rightPress = false; shootPressed = false;
  
  // Update UI
  scoreEl.textContent = 'Score: 0'; comboEl.textContent = 'Combo: 0x';
  updateAmmoDisplay(); waveBar.style.background = 'linear-gradient(90deg, var(--accent), var(--power))';
  
  // Hide menus
  menu.classList.add('hidden'); gameOver.classList.add('hidden');
  
  // Start game loop
  running = true; lastT = performance.now(); requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  finalScore.textContent = `Score: ${score} | Wave: ${wave} | Best Combo: ${combo}x | Difficulty: ${currentDifficulty.toUpperCase()}`;
  gameOver.classList.remove('hidden');
}

function backToMenu() {
  running = false;
  menu.classList.remove('hidden');
  gameOver.classList.add('hidden');
}

/* --- difficulty selection --- */
difficultyBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    difficultyBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentDifficulty = btn.dataset.difficulty;
  });
});

/* --- keyboard controls --- */
document.addEventListener('keydown', e => {
  const gameKeys = ['KeyA', 'KeyD', 'ArrowLeft', 'ArrowRight', 'Space', 'KeyR'];
  if (gameKeys.includes(e.code)) {
    e.preventDefault();
  }
  
  if(e.code === 'KeyA' || e.code === 'ArrowLeft') leftPress = true;
  if(e.code === 'KeyD' || e.code === 'ArrowRight') rightPress = true;
  if(e.code === 'KeyR' && running) startReload();
  if((e.code === 'KeyF' || e.code === 'Space') && running) {
    shootPressed = true; shoot();
  }
});

document.addEventListener('keyup', e => {
  if(e.code === 'KeyA' || e.code === 'ArrowLeft') leftPress = false;
  if(e.code === 'KeyD' || e.code === 'ArrowRight') rightPress = false;
  if(e.code === 'KeyF' || e.code === 'Space') shootPressed = false;
});

/* --- shooting loop --- */
function handleShooting() {
  if (shootPressed && running && !isReloading && currentAmmo > 0) shoot();
  requestAnimationFrame(handleShooting);
}
handleShooting();

/* --- touch controls --- */
const TAP_MAX = 300;
const MOVE_TOL = 20;

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  
  for(const t of e.changedTouches){
    const id = t.identifier;
    const coords = getCanvasCoords(t.clientX, t.clientY);
    const leftBound = W * 0.30;
    const rightBound = W * 0.70;
    
    let mode = 'tap';
    if(coords.x < leftBound) mode = 'hold-left';
    else if(coords.x > rightBound) mode = 'hold-right';
    
    activeTouches[id] = { 
      startX: coords.x, startY: coords.y, 
      startT: Date.now(), mode, moved: false 
    };
    
    if(mode === 'hold-left') leftPress = true;
    if(mode === 'hold-right') rightPress = true;
  }
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  
  for(const t of e.changedTouches){
    const id = t.identifier;
    const info = activeTouches[id];
    if(!info) continue;
    
    const coords = getCanvasCoords(t.clientX, t.clientY);
    const dx = Math.abs(coords.x - info.startX);
    const dy = Math.abs(coords.y - info.startY);
    
    if(dx > MOVE_TOL || dy > MOVE_TOL) {
      info.moved = true;
      
      const leftBound = W * 0.30;
      const rightBound = W * 0.70;
      
      if(coords.x < leftBound){
        info.mode = 'hold-left';
        leftPress = true; rightPress = false;
      } else if(coords.x > rightBound){
        info.mode = 'hold-right';
        rightPress = true; leftPress = false;
      } else {
        leftPress = false; rightPress = false;
      }
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  
  for(const t of e.changedTouches){
    const id = t.identifier;
    const info = activeTouches[id];
    if(!info) continue;
    
    const coords = getCanvasCoords(t.clientX, t.clientY);
    const dt = Date.now() - info.startT;
    
    if(info.mode === 'tap' && dt <= TAP_MAX && !info.moved && running){
      shoot();
    }
    
    if(info.mode === 'hold-left') leftPress = false;
    if(info.mode === 'hold-right') rightPress = false;
    
    delete activeTouches[id];
  }
}, { passive: false });

canvas.addEventListener('touchcancel', function(e) {
  e.preventDefault();
  for(const t of e.changedTouches){
    const id = t.identifier;
    const info = activeTouches[id];
    if(info){
      if(info.mode === 'hold-left') leftPress = false;
      if(info.mode === 'hold-right') rightPress = false;
      delete activeTouches[id];
    }
  }
}, { passive: false });

/* --- buttons --- */
playBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);
menuBtn.addEventListener('click', backToMenu);
exitBtns.forEach(b => b.addEventListener('click', () => location.href = 'index.html'));

/* --- resize handling --- */
function resizeCanvas() {
  updateCanvasScale();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* initial state */
scoreEl.textContent = 'Score: 0';
comboEl.textContent = 'Combo: 0x';
updateAmmoDisplay();
</script>
