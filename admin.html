<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Traffic</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0a1628;color:#e2e8f0;
       display:grid;place-items:center;min-height:100vh;margin:0;padding:20px;}
  .card{background:#0d1b2e;border-radius:16px;padding:32px 40px;
        border:1px solid rgba(255,255,255,.06);text-align:center;min-width:280px;}
  h1{font-size:1.2rem;color:#94a3b8;font-weight:500;margin:0 0 8px;}
  .big{font-size:3.5rem;font-weight:700;color:#7c5cff;margin:0;}
  .sub{color:#94a3b8;font-size:.85rem;margin-top:12px;}
  .err{color:#ef4444;font-size:.85rem;}
</style>
</head>
<body>
<div class="card">
  <h1>Total Views (14 days)</h1>
  <p class="big" id="count">—</p>
  <p class="sub">Unique visitors: <span id="uniques">—</span></p>
  <p class="err" id="error"></p>
</div>

<script>
  fetch('traffic.json')
    .then(r => r.json())
    .then(data => {
      // GitHub returns: { count: 123, uniques: 45, views: [...] }
      document.getElementById('count').textContent = data.count ?? '?';
      document.getElementById('uniques').textContent = data.uniques ?? '?';
    })
    .catch(e => {
      document.getElementById('error').textContent =
        'traffic.json not found. Run the workflow once.';
    });
</script>
</body>
</html>
